<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>

  <!-- Bootstrap CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Our own (small) styles -->
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <!-- ============ NAVBAR ============ -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    </div>
  </nav>

  <main class="container pb-5">

    <!-- ============ ALERT ZONE (errors show up here) ============ -->
    <div id="alert-zone" aria-live="polite"></div>

    <!-- ============ SUMMARY CARDS (CSS Grid) ============ -->
    <div class="summary-grid mb-4">
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <p class="text-muted mb-1">Total</p>
          <h2 class="fw-bold mb-0" id="summary-total">0.00</h2>
        </div>
      </div>
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <p class="text-muted mb-1">Number of expenses</p>
          <h2 class="fw-bold mb-0" id="summary-count">0</h2>
        </div>
      </div>
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <p class="text-muted mb-1">Highest expense</p>
          <h2 class="fw-bold mb-0" id="summary-highest">0.00</h2>
          <p class="text-muted small mb-0" id="summary-highest-title"></p>
        </div>
      </div>
    </div>

    <!-- ============ ADD EXPENSE ============ -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Add expense</h5>

        <form id="expense-form" class="row g-3" novalidate>
          <div class="col-12 col-md-3">
            <label for="input-title" class="form-label">Title</label>
            <input type="text" class="form-control" id="input-title" placeholder="Lunch" required />
            <div class="invalid-feedback" id="error-title"></div>
          </div>

          <div class="col-12 col-md-3">
            <label for="input-amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="input-amount" placeholder="0.00" step="0.01" min="0.01" required />
            <div class="invalid-feedback" id="error-amount"></div>
          </div>

          <div class="col-12 col-md-3">
            <label for="input-category" class="form-label">Category</label>
            <select class="form-select" id="input-category" required>
              <option value="" selected disabled>Choose…</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
            <div class="invalid-feedback" id="error-category"></div>
          </div>

          <div class="col-12 col-md-3">
            <label for="input-date" class="form-label">Date</label>
            <input type="date" class="form-control" id="input-date" required />
            <div class="invalid-feedback" id="error-date"></div>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary" id="submit-btn">Add expense</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============ TABLE + FILTER ============ -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
          <h5 class="card-title mb-0">Expenses</h5>

          <div class="d-flex align-items-center gap-2">
            <label for="filter-category" class="form-label mb-0">Category</label>
            <select class="form-select form-select-sm" id="filter-category" style="width: auto;">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
            <button class="btn btn-sm btn-outline-secondary" id="export-csv-btn" type="button">
              Export CSV
            </button>
          </div>
        </div>

        <!-- Spinner shown while loading -->
        <div id="loading-spinner" class="text-center py-5 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="text-center text-muted py-5 d-none">
          No expenses yet. Add your first one above.
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle" id="expenses-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="expenses-tbody">
              <!-- rows injected by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ EDIT MODAL ============ -->
  <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modal-label" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="edit-modal-label">Edit expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="edit-form" class="row g-3" novalidate>
            <input type="hidden" id="edit-id" />

            <div class="col-12">
              <label for="edit-title" class="form-label">Title</label>
              <input type="text" class="form-control" id="edit-title" required />
              <div class="invalid-feedback" id="edit-error-title"></div>
            </div>

            <div class="col-12">
              <label for="edit-amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="edit-amount" step="0.01" min="0.01" required />
              <div class="invalid-feedback" id="edit-error-amount"></div>
            </div>

            <div class="col-12">
              <label for="edit-category" class="form-label">Category</label>
              <select class="form-select" id="edit-category" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback" id="edit-error-category"></div>
            </div>

            <div class="col-12">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" class="form-control" id="edit-date" required />
              <div class="invalid-feedback" id="edit-error-date"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-edit-btn">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle (includes Popper, needed for modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Our own script -->
  <script src="js/app.js"></script>
</body>
</html>
